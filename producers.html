<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>生産者</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div style="flex:1"><h1>生産者</h1></div>
    </div>
    <div class="content">
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="ic">🧑‍🌾</div>
        <p>生産者が登録されていません<br>右下のボタンから登録しましょう</p>
      </div>
    </div>
  </div>

  <button class="fab" id="fab" aria-label="生産者を登録">＋</button>

  <nav class="tabbar">
    <a href="index.html"><span class="ic">📋</span>訪問記録</a>
    <a href="producers.html" class="active"><span class="ic">🧑‍🌾</span>生産者</a>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <span class="t">生産者を登録</span>
      <button class="x" id="sheet-close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <div class="lab">生産者名</div>
        <input type="text" class="inline-input" id="f-name" placeholder="例：田中 一郎">
      </div>
      <div class="field">
        <div class="lab">農場名</div>
        <input type="text" class="inline-input" id="f-farm" placeholder="例：田中農園">
      </div>
      <div class="field">
        <div class="lab">主な作物</div>
        <input type="text" class="inline-input" id="f-crop" placeholder="例：トマト、イチゴ">
      </div>
      <div class="field">
        <div class="lab">メモ</div>
        <textarea class="inline-area" id="f-memo" rows="1" placeholder="住所や連絡先など…"></textarea>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn block" id="save">登録する</button>
    </div>
  </div>

  <script>
    const KEY = 'farm_producers';
    const load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
    const save = d => localStorage.setItem(KEY, JSON.stringify(d));
    const countVisits = name => JSON.parse(localStorage.getItem('farm_visits') || '[]')
      .filter(v => v.producer === name).length;

    function render() {
      const producers = load();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      empty.style.display = producers.length ? 'none' : 'block';

      producers.forEach((p, idx) => {
        const n = countVisits(p.name);
        const row = document.createElement('a');
        row.className = 'row';
        row.href = `producer-detail.html?name=${encodeURIComponent(p.name)}`;
        row.innerHTML = `
          <div class="avatar">${(p.name || '?').slice(0,1)}</div>
          <div class="body">
            <div class="name">${p.name}</div>
            <div class="sub">${[p.farm, p.crop].filter(Boolean).join('・') || '—'}</div>
          </div>
          ${n ? `<span class="count">${n}回</span>` : ''}
          <span class="chev">›</span>
        `;
        list.appendChild(row);
      });
    }

    /* sheet */
    const scrim = document.getElementById('scrim');
    const sheet = document.getElementById('sheet');
    function openSheet() {
      ['f-name','f-farm','f-crop','f-memo'].forEach(id => document.getElementById(id).value = '');
      scrim.classList.add('open'); sheet.classList.add('open');
    }
    function closeSheet() { scrim.classList.remove('open'); sheet.classList.remove('open'); }
    document.getElementById('fab').onclick = openSheet;
    document.getElementById('sheet-close').onclick = closeSheet;
    scrim.onclick = closeSheet;

    const memo = document.getElementById('f-memo');
    memo.addEventListener('input', () => { memo.style.height='auto'; memo.style.height = memo.scrollHeight+'px'; });

    document.getElementById('save').onclick = () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) { alert('生産者名を入力してください'); return; }
      const d = load();
      d.push({
        name,
        farm: document.getElementById('f-farm').value.trim(),
        crop: document.getElementById('f-crop').value.trim(),
        memo: document.getElementById('f-memo').value.trim(),
      });
      save(d); closeSheet(); render();
    };

    render();
  </script>
</body>
</html>
