<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>訪問記録</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div style="flex:1"><h1>訪問記録</h1></div>
    </div>
    <div class="content">
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="ic">🌱</div>
        <p>まだ訪問記録がありません<br>右下のボタンから記録しましょう</p>
      </div>
    </div>
  </div>

  <a class="fab" id="fab" href="editor.html" aria-label="記録を追加">＋</a>

  <nav class="tabbar">
    <a href="index.html" class="active"><span class="ic">📋</span>訪問記録</a>
    <a href="producers.html"><span class="ic">🧑‍🌾</span>生産者</a>
  </nav>

  <script src="app.js"></script>
  <script>
    function render() {
      const visits = Store.visits();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      empty.style.display = visits.length ? 'none' : 'block';

      visits.slice().reverse().forEach(r => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `editor.html?id=${encodeURIComponent(r.id)}`;
        card.style.textDecoration = 'none';
        card.style.color = 'inherit';
        card.style.display = 'block';

        let photoHtml = '';
        if (r.photos && r.photos.length) {
          const n = Math.min(r.photos.length, 3);
          photoHtml = `<div class="photos n${n}">${r.photos.slice(0,3).map(s =>
            `<img src="${s}" alt="写真">`).join('')}</div>`;
        }
        // メモは長文になりうるので一覧では先頭を抜粋
        const excerpt = r.memo && r.memo.length > 140 ? r.memo.slice(0, 140) + '…' : r.memo;

        card.innerHTML = `
          <div class="head">
            <div>
              <div class="title">${escapeHtml(r.producer) || '（生産者未選択）'}</div>
              <div class="date">${fmtFull(r.date)}</div>
            </div>
            <span class="chev" style="color:var(--text-3);font-size:1.2rem">›</span>
          </div>
          ${r.crop ? `<div><span class="chip">${escapeHtml(r.crop)}</span></div>` : ''}
          ${excerpt ? `<div class="memo">${escapeHtml(excerpt)}</div>` : ''}
          ${photoHtml}
        `;
        list.appendChild(card);
      });
    }
    render();
  </script>
</body>
</html>
