<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>訪問履歴</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a href="producers.html" class="back">‹</a>
      <div style="flex:1">
        <h1 id="p-name" style="font-size:1.2rem">生産者</h1>
        <div class="sub" id="p-sub"></div>
      </div>
      <button class="btn danger-text" id="del-producer">削除</button>
    </div>

    <div class="content">
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="ic">📭</div>
        <p>この生産者の訪問記録はまだありません</p>
      </div>
    </div>
  </div>

  <a class="fab" id="fab" aria-label="この生産者を記録">＋</a>

  <nav class="tabbar">
    <a href="index.html"><span class="ic">📋</span>訪問記録</a>
    <a href="producers.html" class="active"><span class="ic">🧑‍🌾</span>生産者</a>
  </nav>

  <script src="app.js"></script>
  <script>
    const name = new URLSearchParams(location.search).get('name') || '';
    const producer = Store.producers().find(p => p.name === name);

    document.getElementById('p-name').textContent = name;
    document.title = `${name} の訪問履歴`;
    if (producer) document.getElementById('p-sub').textContent =
      [producer.farm, producer.crop].filter(Boolean).join('・');

    document.getElementById('fab').href = `editor.html?producer=${encodeURIComponent(name)}`;

    function render() {
      const visits = Store.visitsFor(name).slice().reverse();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      empty.style.display = visits.length ? 'none' : 'block';

      visits.forEach(v => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `editor.html?id=${encodeURIComponent(v.id)}`;
        card.style.cssText = 'text-decoration:none;color:inherit;display:block';

        let photoHtml = '';
        if (v.photos && v.photos.length) {
          const n = Math.min(v.photos.length, 3);
          photoHtml = `<div class="photos n${n}">${v.photos.slice(0,3).map(s =>
            `<img src="${s}" alt="写真">`).join('')}</div>`;
        }
        const excerpt = v.memo && v.memo.length > 140 ? v.memo.slice(0, 140) + '…' : v.memo;

        card.innerHTML = `
          <div class="head">
            <div class="date">${fmtFull(v.date)}</div>
            <span class="chev" style="color:var(--text-3);font-size:1.2rem">›</span>
          </div>
          ${v.crop ? `<div><span class="chip">${escapeHtml(v.crop)}</span></div>` : ''}
          ${excerpt ? `<div class="memo">${escapeHtml(excerpt)}</div>` : ''}
          ${photoHtml}
        `;
        list.appendChild(card);
      });
    }

    document.getElementById('del-producer').onclick = () => {
      if (!confirm(`「${name}」を削除しますか？\n（訪問記録は残ります）`)) return;
      Store.saveProducers(Store.producers().filter(p => p.name !== name));
      location.href = 'producers.html';
    };

    render();
  </script>
</body>
</html>
