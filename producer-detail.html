<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>訪問履歴</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a href="producers.html" class="back">‹</a>
      <div style="flex:1">
        <h1 id="p-name" style="font-size:1.2rem">生産者</h1>
        <div class="sub" id="p-sub"></div>
      </div>
      <button class="btn danger-text" id="del-producer">削除</button>
    </div>

    <div class="content">
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="ic">📭</div>
        <p>この生産者の訪問記録はまだありません</p>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="index.html"><span class="ic">📋</span>訪問記録</a>
    <a href="producers.html" class="active"><span class="ic">🧑‍🌾</span>生産者</a>
  </nav>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lb-close">✕</span>
    <img id="lb-img" src="" alt="">
  </div>

  <script>
    const name = new URLSearchParams(location.search).get('name') || '';
    const producers = JSON.parse(localStorage.getItem('farm_producers') || '[]');
    const producer = producers.find(p => p.name === name);

    document.getElementById('p-name').textContent = name;
    document.title = `${name} の訪問履歴`;
    if (producer) document.getElementById('p-sub').textContent =
      [producer.farm, producer.crop].filter(Boolean).join('・');

    const fmt = dt => dt ? new Date(dt).toLocaleString('ja-JP',
      { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', weekday:'short' }) : '';

    function render() {
      const visits = JSON.parse(localStorage.getItem('farm_visits') || '[]')
        .map((v,i) => ({ ...v, _idx:i })).filter(v => v.producer === name).reverse();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      empty.style.display = visits.length ? 'none' : 'block';

      visits.forEach(v => {
        const card = document.createElement('div');
        card.className = 'card';
        let photoHtml = '';
        if (v.photos && v.photos.length) {
          const n = Math.min(v.photos.length, 3);
          photoHtml = `<div class="photos n${n}">${v.photos.map(s =>
            `<img src="${s}" data-src="${s}" alt="写真">`).join('')}</div>`;
        }
        card.innerHTML = `
          <div class="head">
            <div class="date">${fmt(v.date)}</div>
            <button class="btn danger-text" data-idx="${v._idx}">削除</button>
          </div>
          ${v.crop ? `<div><span class="chip">${v.crop}</span></div>` : ''}
          ${v.memo ? `<div class="memo">${v.memo}</div>` : ''}
          ${photoHtml}
        `;
        list.appendChild(card);
      });

      list.querySelectorAll('[data-idx]').forEach(b => b.onclick = () => {
        if (!confirm('この記録を削除しますか？')) return;
        const all = JSON.parse(localStorage.getItem('farm_visits') || '[]');
        all.splice(+b.dataset.idx, 1);
        localStorage.setItem('farm_visits', JSON.stringify(all));
        render();
      });
      list.querySelectorAll('.photos img').forEach(img =>
        img.onclick = () => openLightbox(img.dataset.src));
    }

    document.getElementById('del-producer').onclick = () => {
      if (!confirm(`「${name}」を削除しますか？\n（訪問記録は残ります）`)) return;
      const d = producers.filter(p => p.name !== name);
      localStorage.setItem('farm_producers', JSON.stringify(d));
      location.href = 'producers.html';
    };

    function openLightbox(src) {
      document.getElementById('lb-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('lb-close').onclick = () => document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); };

    render();
  </script>
</body>
</html>
